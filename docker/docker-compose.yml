version: "3.9"

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/work
      - revenant-ccache:/ccache
    environment:
      CCACHE_DIR: /ccache
    shm_size: "2gb"
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
    working_dir: /work

volumes:
  revenant-ccache:
