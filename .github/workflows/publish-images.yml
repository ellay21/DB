name: Publish CI Docker Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR (false = build-only dry run)"
        required: false
        default: "true"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "Build & push ${{ matrix.variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gcc-13
            target: ci-gcc13
            tag: gcc-13
          - variant: clang-18
            target: ci-clang18
            tag: clang-18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        if: inputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.ci
          target: ${{ matrix.target }}
          push: ${{ inputs.push == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/revenant-ci:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output digest
        if: inputs.push == 'true'
        run: |
          echo "## Image: ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pin this digest in \`.github/workflows/ci.yml\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository_owner }}/revenant-ci@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Digest (${{ matrix.variant }})::ghcr.io/${{ github.repository_owner }}/revenant-ci@${{ steps.build.outputs.digest }}"
